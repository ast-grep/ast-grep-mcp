# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
name: Tests

permissions:
  contents: read

env:
  AST_GREP_VERSION: 0.45.0

on:  # https://docs.github.com/en/actions/reference/events-that-trigger-workflows
  push:
    branches:
    - '**'
    tags-ignore:  # don't build tags
    - '**'
    paths-ignore:
    - '**/*.md'
  pull_request:
    paths-ignore:
    - '**/*.md'
  workflow_dispatch:
    # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#workflow_dispatch

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: Git Checkout
      uses: actions/checkout@v6  # https://github.com/actions/checkout

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: |
        uv sync --frozen --all-extras --dev

    - name: Verify lock file
      run: uv lock --check

    - name: Install and verify ast-grep
      run: |
        npm install \
          --prefix .ci-tools \
          --no-save \
          --package-lock=false \
          "@ast-grep/cli@${AST_GREP_VERSION}"
        executable="$(node -e '
          const path = require("node:path")
          const name = process.platform === "win32" ? "ast-grep.cmd" : "ast-grep"
          process.stdout.write(path.resolve(".ci-tools/node_modules/.bin", name))
        ')"
        node -e '
          const fs = require("node:fs")
          if (!fs.statSync(process.argv[1]).isFile()) process.exit(1)
        ' "$executable"
        export PATH="$PWD/.ci-tools/node_modules/.bin:$PATH"
        reported_version="$(ast-grep --version)"
        test "$reported_version" = "ast-grep $AST_GREP_VERSION"
        printf 'AST_GREP_TEST_EXECUTABLE=%s\n' "$executable" >> "$GITHUB_ENV"

    - name: Lint with ruff
      run: |
        uv run --frozen ruff check .

    - name: Format check with ruff
      run: |
        uv run --frozen ruff format --check .

    - name: Type check with mypy
      run: |
        uv run --frozen mypy main.py tests

    - name: Smoke test packaged entry point
      run: |
        uv run --frozen ast-grep-server --help

    - name: Run unit tests
      run: |
        uv run --frozen pytest tests/test_unit.py -v --cov=main --cov-report=term-missing

    - name: Run integration tests
      run: |
        uv run --frozen pytest tests/test_integration.py -v
