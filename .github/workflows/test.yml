name: Tests

permissions:
  contents: read

'on':
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  UV_PROJECT_ENVIRONMENT: .venv

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: Git Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version-file: .python-version

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --locked --all-extras --dev --no-python-downloads

    - name: Verify repository environment
      run: uv run --no-sync python scripts/verify_environment.py

    - name: Verify lock file
      run: uv lock --check

    - name: Install and verify ast-grep
      run: |
        version="$(uv run --no-sync python -c 'import main; print(main.SUPPORTED_AST_GREP_VERSION)')"
        npm install \
          --prefix .ci-tools \
          --no-save \
          --package-lock=false \
          "@ast-grep/cli@${version}"
        executable="$(node -e '
          const path = require("node:path")
          const name = process.platform === "win32" ? "ast-grep.cmd" : "ast-grep"
          process.stdout.write(path.resolve(".ci-tools/node_modules/.bin", name))
        ')"
        node -e '
          const fs = require("node:fs")
          if (!fs.statSync(process.argv[1]).isFile()) process.exit(1)
        ' "$executable"
        export PATH="$PWD/.ci-tools/node_modules/.bin:$PATH"
        reported_version="$(ast-grep --version)"
        test "$reported_version" = "ast-grep $version"
        printf 'AST_GREP_TEST_EXECUTABLE=%s\n' "$executable" >> "$GITHUB_ENV"

    - name: Lint with ruff
      run: |
        uv run --no-sync ruff check .

    - name: Format check with ruff
      run: |
        uv run --no-sync ruff format --check .

    - name: Type check with mypy
      run: |
        uv run --no-sync mypy main.py config_snapshot.py scripts tests

    - name: Type check with pyright
      run: |
        uv run --no-sync pyright

    - name: Smoke test packaged entry point
      run: |
        uv run --no-sync ast-grep-server --help

    - name: Smoke test repository launcher
      run: uv run --no-sync python scripts/launch_server.py --help

    - name: Run unit tests
      env:
        # config_snapshot.py's dir_fd copy walker is POSIX-only and unreachable on
        # Windows, so the shared threshold is enforced on Linux and macOS instead.
        COVERAGE_THRESHOLD: ${{ runner.os == 'Windows' && '0' || '84' }}
      run: |
        uv run --no-sync pytest tests/test_unit.py tests/test_config_snapshot.py tests/test_environment_policy.py -v --cov=main --cov=config_snapshot --cov-report=term-missing --cov-fail-under "$COVERAGE_THRESHOLD"

    - name: Run integration tests
      run: |
        uv run --no-sync pytest tests/test_integration.py -v

    - name: Build and check distributions
      if: runner.os == 'Linux'
      run: |
        version="$(uv run --no-sync python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
        uv run --no-sync python -m build --sdist --wheel --no-isolation
        uv run --no-sync twine check --strict "dist/sg_mcp-${version}-py3-none-any.whl" "dist/sg_mcp-${version}.tar.gz"
        uv run --no-sync check-wheel-contents "dist/sg_mcp-${version}-py3-none-any.whl"
        uv run --no-sync python tests/package_smoke.py \
          "dist/sg_mcp-${version}-py3-none-any.whl" \
          "dist/sg_mcp-${version}.tar.gz" \
          "$version"
