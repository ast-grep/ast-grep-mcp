[project]
name = "ast-soleaux"
version = "0.5.0"
description = "A bounded structural analysis, transformation, and execution MCP server"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
maintainers = [
  { name = "John McLaughlin", email = "31931302+jmclaughlin724@users.noreply.github.com" },
]
keywords = ["ast-grep", "mcp", "static-analysis", "structural-search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastmcp==4.0.0b3",
  "pydantic>=2.11.0,<3",
  "pyyaml>=6.0.2,<7",
]

[project.urls]
Issues = "https://github.com/jmclaughlin724/ast-grep-mcp/issues"
Repository = "https://github.com/jmclaughlin724/ast-grep-mcp"

[project.scripts]
ast-soleaux = "ast_soleaux.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.16.1",
  "mypy>=1.17.1",
  "pyright==1.1.411",
  "types-pyyaml>=6.0.12.20250809",
  "build>=1.3.0,<2",
  "check-wheel-contents>=0.6.3,<1",
  "setuptools>=77",
  "twine>=6.2.0,<7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.check-wheel-contents]
toplevel = ["ast_soleaux"]

[tool.coverage.run]
source = ["ast_soleaux"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pass",
  "except ImportError:",
]

[tool.mypy]
python_version = "3.14"
exclude = ["^tests/fixtures/"]
warn_return_any = true
disallow_any_generics = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=test-runtime"
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.setuptools]
packages = ["ast_soleaux"]

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b3"]
